name: WIRD Quality Gate

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Tests, TypeScript, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Setup Bun for lockfile verification
        uses: oven-sh/setup-bun@v2
      - name: Refresh Bun lockfile for the new rules-test dependency
        run: |
          bun install --force
          git diff -- bun.lock
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Run automated test suites
        run: npm test
      - name: Set up Java 21 for Firestore Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Firestore Security Rules Emulator Tests
        run: npm run test:firestore-rules
      - name: TypeScript validation
        run: npm run lint
      - name: Production build (includes Quran chunk validation)
        run: npm run build
      - name: Production server startup smoke test
        run: npm run smoke:server
