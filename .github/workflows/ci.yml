name: WIRD Quality Gate

on:
  push:
    branches: [main] # Feature-branch commits are validated by their PR run; avoid duplicate full suites.
  workflow_dispatch:
    inputs:
      validate_mushaf:
        description: Validate all 604 official printed Mushaf page coordinate maps
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Tests, TypeScript, and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Verify Node.js runtime matches Vercel
        run: node -e "if (process.versions.node.split('.')[0] !== '26') process.exit(1)"
      - name: Setup Bun for the locked dependency graph
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies from the committed lockfile
        run: bun install --frozen-lockfile
      - name: Audit the committed Bun dependency graph
        run: bun audit --audit-level=high
      - name: Run automated test suites
        run: bun run test
