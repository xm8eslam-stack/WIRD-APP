name: WIRD Quality Gate

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Tests, TypeScript, and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Setup Bun for lockfile verification
        uses: oven-sh/setup-bun@v2
      - name: Refresh Bun lockfile for the new rules-test dependency
        run: |
          bun install --force
          git diff -- bun.lock
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright test runner for TypeScript validation
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Run automated test suites
        run: npm test
      - name: Verify native TypeScript API module imports
        run: npm run smoke:api-imports
      - name: Verify approved Quran audio CDN availability and byte-range streaming
        run: node scripts/check-ruqyah-audio-source.mjs
      - name: Set up Java 21 for Firestore Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Firestore Security Rules Emulator Tests
        run: npm run test:firestore-rules
      - name: TypeScript validation
        run: npm run lint
      - name: Production build (includes Quran chunk validation)
        run: npm run build
      - name: Production server startup smoke test
        run: npm run smoke:server

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser smoke tests
        run: npx playwright test
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-results
          path: test-results/playwright
          if-no-files-found: ignore
