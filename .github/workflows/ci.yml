name: WIRD Quality Gate

on:
  push:
    branches: [main] # Feature-branch commits are validated by their PR run; avoid duplicate full suites.
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Tests, TypeScript, and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Verify Node.js runtime matches Vercel
        run: node -e "if (process.versions.node.split('.')[0] !== '26') process.exit(1)"
      - name: Setup Bun for lockfile verification
        uses: oven-sh/setup-bun@v2
      - name: Refresh Bun lockfile for the new rules-test dependency
        run: |
          bun install --force
          git diff -- bun.lock
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright test runner for TypeScript validation
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Run automated test suites
        run: npm test
      - name: Verify native TypeScript API module imports
        run: npm run smoke:api-imports
      - name: Verify approved Quran audio CDN availability and byte-range streaming
        run: node scripts/check-ruqyah-audio-source.mjs
      - name: Set up Java 21 for Firestore Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Firestore Security Rules Emulator Tests
        run: npm run test:firestore-rules
      - name: TypeScript validation
        run: npm run lint
      - name: Production build (includes Quran chunk validation)
        run: npm run build
      - name: Production server startup smoke test
        run: npm run smoke:server

      # Playwright's browser downloader is kept on Node 24 for compatibility;
      # the app build, server smoke, and actual browser tests remain on Node 26.
      - name: Set up Node.js 24 for Playwright browser download
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Restore Node.js 26 for browser tests
        uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Verify Node.js runtime before browser tests
        run: node -e "if (process.versions.node.split('.')[0] !== '26') process.exit(1)"
      - name: Desktop and mobile browser smoke tests
        run: npx playwright test
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-results
          path: test-results/playwright
          if-no-files-found: ignore
