name: WIRD Quality Gate

on:
  push:
    branches: [main] # Feature-branch commits are validated by their PR run; avoid duplicate full suites.
  workflow_dispatch:
    inputs:
      validate_mushaf:
        description: Validate all 604 official printed Mushaf page coordinate maps
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Tests, TypeScript, and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Verify Node.js runtime matches Vercel
        run: node -e "if (process.versions.node.split('.')[0] !== '26') process.exit(1)"
      - name: Setup Bun for the locked dependency graph
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies from the committed lockfile
        run: bun install --frozen-lockfile
      - name: Audit the committed Bun dependency graph
        run: bun audit --audit-level=high
      - name: Run automated test suites
        run: bun run test
      - name: Verify all 604 printed Mushaf coordinate maps against WIRD local Quran data
        if: ${{ inputs.validate_mushaf || contains(github.event.pull_request.title, 'Mushaf') || contains(github.head_ref, 'mushaf') }}
        run: bun run mushaf:validate-coverage
      - name: Verify native TypeScript API module imports
        run: bun run smoke:api-imports
      - name: Verify approved Quran audio CDN availability and byte-range streaming
        run: node scripts/check-ruqyah-audio-source.mjs
      - name: Set up Java 21 for Firestore Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Firestore Security Rules Emulator Tests
        run: bun run test:firestore-rules
      - name: TypeScript validation
        run: bun run lint
      - name: Production build (includes Quran chunk validation)
        run: bun run build
      - name: Production server startup smoke test
        run: bun run smoke:server

      # Playwright browser download remains on Node 24 for compatibility;
      # app build, server smoke, and actual browser tests run on Node 26.
      - name: Set up Node.js 24 for Playwright browser download
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Chromium for browser tests
        run: bunx playwright install --with-deps chromium
      - name: Restore Node.js 26 for browser tests
        uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Verify Node.js runtime before browser tests
        run: node -e "if (process.versions.node.split('.')[0] !== '26') process.exit(1)"
      - name: Desktop and mobile browser smoke tests
        run: bunx playwright test
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-results
          path: test-results/playwright
          if-no-files-found: ignore
