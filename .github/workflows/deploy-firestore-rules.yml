name: Deploy Firestore Rules (Manual)

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Firebase project ID. Must exactly match the FIREBASE_PROJECT_ID repository variable."
        required: true
        type: string
      confirmation:
        description: "Type DEPLOY_FIRESTORE_RULES to authorize this production rules deployment."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firestore-rules-deploy-${{ inputs.project_id }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy reviewed Firestore rules
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies for Firestore rules verification
        run: npm install --no-audit --no-fund

      - name: Set up Java 21 for Firestore Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Firestore Security Rules in Emulator
        run: npm run test:firestore-rules

      - name: Validate deployment target and credentials
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          CONFIRM_PROJECT_ID: ${{ inputs.project_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "DEPLOY_FIRESTORE_RULES" ]]; then
            echo "::error::Type DEPLOY_FIRESTORE_RULES exactly to authorize deployment."
            exit 1
          fi
          if [[ -z "$FIREBASE_PROJECT_ID" || "$CONFIRM_PROJECT_ID" != "$FIREBASE_PROJECT_ID" ]]; then
            echo "::error::Input project ID must exactly match the FIREBASE_PROJECT_ID repository variable."
            exit 1
          fi
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_JSON repository secret."
            exit 1
          fi
          echo "Deployment target validated: $FIREBASE_PROJECT_ID"

      - name: Authenticate to the exact Firebase project
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}

      - name: Verify deployed Firestore rules exactly match the reviewed repository source
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          access_token="$(gcloud auth print-access-token)"
          release_url="https://firebaserules.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/releases/cloud.firestore"
          release_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${access_token}" \
            "$release_url")"
          ruleset_name="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["rulesetName"])' <<< "$release_json")"
          if [[ -z "$ruleset_name" ]]; then
            echo "::error::No deployed default-database Firestore ruleset was returned; refusing an unreviewed bootstrap deployment."
            exit 1
          fi
          ruleset_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${access_token}" \
            "https://firebaserules.googleapis.com/v1/${ruleset_name}")"
          python3 - "$ruleset_json" firestore.rules <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          ruleset = json.loads(sys.argv[1])
          local_path = pathlib.Path(sys.argv[2])
          local_source = local_path.read_text(encoding="utf-8")
          files = ruleset.get("source", {}).get("files", [])
          deployed = next(
              (item.get("content") for item in files if item.get("name") == local_path.name),
              None,
          )
          if deployed is None:
              print("::error::The active production ruleset does not contain firestore.rules; refusing deployment.")
              raise SystemExit(1)
          local_hash = hashlib.sha256(local_source.encode()).hexdigest()
          deployed_hash = hashlib.sha256(deployed.encode()).hexdigest()
          if local_source != deployed:
              print("::error::Production Firestore rules differ from the reviewed repository file.")
              print(f"Repository SHA-256: {local_hash}")
              print(f"Production SHA-256: {deployed_hash}")
              print("Review the production rules and reconcile them explicitly before deploying.")
              raise SystemExit(1)
          print(f"Production Firestore rules match firestore.rules (SHA-256 {local_hash}).")
          PY

      - name: Deploy Firestore Security Rules only
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.0.0 deploy \
            --only firestore:rules \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
